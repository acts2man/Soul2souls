# Netlify — serves the pre-built exact reproduction in site/ (no build step).
[build]
  publish = "site"

# Legacy WordPress permalink used on the original site.
[[redirects]]
  from = "/about-example-1/"
  to = "/about/"
  status = 301
  force = true

# Nice-to-have: /home -> /
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
